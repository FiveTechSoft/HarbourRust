name: macOS ARM64 feasibility (not a release build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-feasibility:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify ARM64 host and toolchain
        run: |
          set -eu
          test "$(uname -m)" = arm64
          uname -a
          sw_vers
          rustc --version
          clang --version
      - name: Build the compiler from the checked-out source
        run: rustc --edition=2021 -O src/hbc.rs -o hbc
      - name: Emit the bounded LLVM smoke sample
        run: |
          set -eu
          cat > macos.prg <<'PRG'
          function Main()
          local s:="hello", a:={3,5,7},i,n:=0
          for i:=1 to Len(a)
          n:=n+a[i]
          next
          ? s
          ? "soma",n
          ? "fatorial",Factorial(10)
          return nil
          function Factorial(n)
          return IIF(n<=1,1,n*Factorial(n-1))
          PRG
          ./hbc macos.prg program.ll --experimental-llvm
          clang -target arm64-apple-macos14 -c program.ll -o program.o
      - name: Verify the current runtime boundary (expected to need a Darwin adapter)
        run: |
          set -eu
          # This is deliberately NOT continue-on-error: a link failure is not a smoke pass.
          # main currently emits an x86-64/Linux assembly runtime sidecar.
          # The first run records the exact Darwin linker/assembler errors for that source.
          clang -target arm64-apple-macos14 program.o program.ll.runtime.s -o smoke
          ./smoke > smoke.stdout
          python3 - <<'PY'
          from pathlib import Path
          expected=b'\nhello\nsoma         15\nfatorial    3628800'
          actual=Path('smoke.stdout').read_bytes()
          assert actual == expected, (actual, expected)
          PY
  linux-thread-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux outputs of the thread programs (reference for Mach-O ARM64)
        run: |
          set -eu
          rustc --edition=2021 -O src/hbc.rs -o hbc
          mkdir -p ref bin
          for f in tests/threads/programs/*.prg; do
            b=$(basename "$f" .prg)
            ./hbc "$f" "bin/$b" --target=linux
            (cd bin && set +e; timeout 60 "./$b" > "../ref/$b.stdout" 2> "../ref/$b.stderr" < /dev/null; echo $? > "../ref/$b.rc")
          done
          ls ref | wc -l
      - name: Linux outputs of the EXTERNAL demos (gcc bridge, as, ld)
        run: |
          set -eu
          gcc -c -O2 -ffreestanding -fno-stack-protector -Iextend extend/hbhbr.c -o bin/hbhbr.o
          gcc -c -O2 -ffreestanding -fno-stack-protector -Iextend extend/demo/apif64.c -o bin/apif64.c.o
          for n in apif64 apiecho apiref apistorref apiitem apiarr apieval extdemo; do
            c=extend/demo/$n.c; [ "$n" = extdemo ] && c=extend/demo/myext.c
            gcc -c -O2 -ffreestanding -fno-stack-protector -Iextend "$c" -o "bin/$n.c.o"
            ./hbc "extend/demo/$n.prg" "bin/$n.s" --target=linux
            as "bin/$n.s" -o "bin/$n.o"
            extra=""; case $n in apiref|apiitem|apistorref|apiarr|apieval) extra=bin/apif64.c.o;; esac
            ld -o "bin/ext_$n" "bin/$n.o" "bin/$n.c.o" bin/hbhbr.o $extra
            (cd bin && set +e; timeout 60 "./ext_$n" > "../ref/ext_$n.stdout" 2> "../ref/ext_$n.stderr" < /dev/null; echo $? > "../ref/ext_$n.rc")
          done
          ls ref | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: thread-reference
          path: ref
  native-arm64:
    needs: linux-thread-reference
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the compiler
        run: |
          set -eu
          test "$(uname -m)" = arm64
          sw_vers
          rustc --version
          rustc --edition=2021 -O src/hbc.rs -o hbc
      - name: Native Mach-O ARM64 smoke (loader, signature, dyld)
        run: |
          set -eu
          printf 'function Main()\n? "hello", 2^10, Log(100)\nreturn nil\n' > smoke.prg
          ./hbc smoke.prg smoke --target=macho-arm64
          file smoke
          otool -hl smoke | head -60
          codesign -v -vvv smoke || true
          ./smoke; echo "exit=$?"
      - uses: actions/download-artifact@v4
        with:
          name: thread-reference
          path: thread-ref
      - name: Native Mach-O ARM64 battery
        if: always()
        run: python3 tests/run_macho_arm64.py --hbc ./hbc --thread-ref thread-ref
